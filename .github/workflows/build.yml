name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# one release at a time so two quick pushes don't race each other
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; else export VERSION="$(tr -d '[:space:]' < VERSION)"; fi
          ./scripts/build.sh
      - name: Package
        run: |
          mkdir -p pkg/TheHouseAlwaysWins-Client pkg/TheHouseAlwaysWins-Client-Linux pkg/TheHouseAlwaysWins-Server-Windows pkg/TheHouseAlwaysWins-Server-Linux out
          cp dist/TheHouseAlwaysWins.exe README.md LICENSE THIRD_PARTY_NOTICES.md pkg/TheHouseAlwaysWins-Client/
          cp dist/TheHouseAlwaysWins-linux-amd64 dist/TheHouseAlwaysWins-linux-arm64 README.md LICENSE THIRD_PARTY_NOTICES.md pkg/TheHouseAlwaysWins-Client-Linux/
          cp dist/HouseServer.exe dist/server.json dist/run-server.bat README.md LICENSE THIRD_PARTY_NOTICES.md pkg/TheHouseAlwaysWins-Server-Windows/
          cp dist/house-server-linux-amd64 dist/house-server-linux-arm64 dist/server.json dist/thehousealwayswins.service README.md LICENSE THIRD_PARTY_NOTICES.md pkg/TheHouseAlwaysWins-Server-Linux/
          (cd pkg && for d in *; do zip -qr "../out/$d.zip" "$d"; done)
          cp dist/TheHouseAlwaysWins.exe dist/TheHouseAlwaysWins-linux-amd64 dist/TheHouseAlwaysWins-linux-arm64 dist/HouseServer.exe dist/house-server-linux-amd64 dist/house-server-linux-arm64 dist/LICENSE dist/THIRD_PARTY_NOTICES.md out/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: out/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        id: key
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::warning::The ANDROID_KEYSTORE_B64 secret isn't set, so there's no Android build this time. See android-signing/README.txt."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Go bindings (gomobile)
        if: steps.key.outputs.ok == 'true'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get golang.org/x/mobile/bind
          gomobile init
          mkdir -p android/app/libs
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          gomobile bind -v -target=android/arm64,android/arm -androidapi 21 -ldflags "-X github.com/Cmacle/TheHouseAlwaysWins/internal/client.Version=$VERSION" -o android/app/libs/housecore.aar ./mobile
      - name: Build APK
        if: steps.key.outputs.ok == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Collect
        if: steps.key.outputs.ok == 'true'
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/TheHouseAlwaysWins.apk
          # make sure it's signed with the release key, not the debug one
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs out/TheHouseAlwaysWins.apk | grep -i "CN=The House Always Wins"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: android
          path: out/*

  # Pushes to main publish to the release named after the VERSION file
  # (v1.0.0, ...). Bump VERSION for a new release; any other push to main
  # rebuilds and replaces the files on the current one. Pushing a v* tag also
  # works.
  release:
    needs: [desktop, android]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(tr -d '[:space:]' < VERSION)"; fi
          # checksums: the game's auto-update refuses anything not listed here
          (cd files && rm -f SHA256SUMS.txt && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la files
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
            echo "Updated files on release $TAG"
          else
            cat > notes.md <<NOTES
          ## Downloads
          - **TheHouseAlwaysWins.exe**: the game for Windows. Run it, enter the server address, create an account.
          - **TheHouseAlwaysWins-linux-amd64** (or **-arm64**): the game for Linux. \`chmod +x\` it and run it.
          - **TheHouseAlwaysWins.apk**: the game for Android. Open it on your phone to install (allow installs from your browser or file manager when asked).
          - **HouseServer.exe**: the headless server (Windows). Creates \`server.json\` and \`data/\` next to itself on first run.
          - **TheHouseAlwaysWins-Server-Windows.zip**: server + default \`server.json\` + \`run-server.bat\` (auto-restart).
          - **TheHouseAlwaysWins-Server-Linux.zip** / **house-server-linux-***: Linux server + systemd unit.

          Copyright (c) 2026 Cmacle. All rights reserved. Free to download and play for personal, non-commercial use; copying, modifying or redistributing the game or its code is not allowed. See **LICENSE** and **THIRD_PARTY_NOTICES.md**.

          Built automatically from ${GITHUB_SHA::7}.
          NOTES
            sed -i 's/^          //' notes.md
            gh release create "$TAG" files/* --target "$GITHUB_SHA" --title "The House Always Wins $TAG" --notes-file notes.md
            echo "Created release $TAG"
          fi
