name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; else export VERSION="dev-${GITHUB_SHA::7}"; fi
          ./scripts/build.sh
      - name: Package
        run: |
          mkdir -p pkg/TheHouseAlwaysWins-Client pkg/TheHouseAlwaysWins-Server-Windows pkg/TheHouseAlwaysWins-Server-Linux
          cp dist/TheHouseAlwaysWins.exe README.md pkg/TheHouseAlwaysWins-Client/
          cp dist/HouseServer.exe dist/server.json dist/run-server.bat README.md pkg/TheHouseAlwaysWins-Server-Windows/
          cp dist/house-server-linux-amd64 dist/house-server-linux-arm64 dist/server.json dist/thehousealwayswins.service README.md pkg/TheHouseAlwaysWins-Server-Linux/
          cd pkg
          for d in *; do zip -qr "../$d.zip" "$d"; done
      - uses: actions/upload-artifact@v4
        with:
          name: TheHouseAlwaysWins
          path: "*.zip"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.zip --title "The House Always Wins $GITHUB_REF_NAME" --generate-notes
