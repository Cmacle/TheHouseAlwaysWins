name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# one release job at a time so two quick pushes don't race each other
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then export VERSION="${GITHUB_REF_NAME#v}"; else export VERSION="$(tr -d '[:space:]' < VERSION)"; fi
          ./scripts/build.sh
      - name: Package
        run: |
          mkdir -p pkg/TheHouseAlwaysWins-Client pkg/TheHouseAlwaysWins-Server-Windows pkg/TheHouseAlwaysWins-Server-Linux
          cp dist/TheHouseAlwaysWins.exe README.md pkg/TheHouseAlwaysWins-Client/
          cp dist/HouseServer.exe dist/server.json dist/run-server.bat README.md pkg/TheHouseAlwaysWins-Server-Windows/
          cp dist/house-server-linux-amd64 dist/house-server-linux-arm64 dist/server.json dist/thehousealwayswins.service README.md pkg/TheHouseAlwaysWins-Server-Linux/
          cd pkg
          for d in *; do zip -qr "../$d.zip" "$d"; done
      - uses: actions/upload-artifact@v4
        with:
          name: TheHouseAlwaysWins
          path: "*.zip"
      # Pushes to main publish to the release named after the VERSION file
      # (v1.0.0, ...). Bump VERSION for a new release; any other push to main
      # rebuilds and replaces the files on the current one. Pushing a v* tag
      # also works.
      - name: Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(tr -d '[:space:]' < VERSION)"; fi
          cp dist/TheHouseAlwaysWins.exe dist/HouseServer.exe dist/house-server-linux-amd64 dist/house-server-linux-arm64 .
          FILES="TheHouseAlwaysWins.exe HouseServer.exe house-server-linux-amd64 house-server-linux-arm64 *.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            echo "Updated files on release $TAG"
          else
            cat > notes.md <<NOTES
          ## Downloads
          - **TheHouseAlwaysWins.exe**: the game (Windows). Run it, enter the server address, create an account.
          - **HouseServer.exe**: the headless server (Windows). Creates \`server.json\` and \`data/\` next to itself on first run.
          - **TheHouseAlwaysWins-Server-Windows.zip**: server + default \`server.json\` + \`run-server.bat\` (auto-restart).
          - **TheHouseAlwaysWins-Server-Linux.zip** / **house-server-linux-***: Linux server + systemd unit.

          Built automatically from ${GITHUB_SHA::7}.
          NOTES
            sed -i 's/^          //' notes.md
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "The House Always Wins $TAG" --notes-file notes.md
            echo "Created release $TAG"
          fi
