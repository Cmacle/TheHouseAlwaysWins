plugins {
    id 'com.android.application'
}

// Version comes from the repo's VERSION file, e.g. 1.2.1 -> versionCode 10201.
def versionText = rootProject.file('../VERSION').text.trim()
def parts = versionText.tokenize('.').collect { it.replaceAll('[^0-9]', '') as int }
while (parts.size() < 3) { parts << 0 }
def code = parts[0] * 10000 + parts[1] * 100 + parts[2]

android {
    namespace 'com.cmacle.thehousealwayswins'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cmacle.thehousealwayswins'
        minSdk 21
        targetSdk 35
        versionCode code
        versionName versionText
    }

    // The release key (the same one every time, so new APKs install over old
    // ones) is never kept in the repo: CI writes it from the
    // ANDROID_KEYSTORE_B64 secret and passes its path and password in the
    // environment. Without it (a local build) the APK gets the debug key.
    def keyPath = System.getenv('ANDROID_KEYSTORE')
    def haveKey = keyPath != null && file(keyPath).exists()
    signingConfigs {
        release {
            if (haveKey) {
                storeFile file(keyPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'house'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig haveKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Built by: gomobile bind -target=android/arm64,android/arm -o android/app/libs/housecore.aar ./mobile
    implementation files('libs/housecore.aar')
}
